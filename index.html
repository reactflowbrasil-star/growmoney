<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#10b981" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Grow Money Digital — gestão financeira, contratos e agenda para empresas que crescem." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GROW" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" href="https://growmoneydigital.com.br/growsoftware/logogrow.png" />
    <link rel="apple-touch-icon" href="https://growmoneydigital.com.br/growsoftware/logogrow.png" />
    <meta property="og:title" content="Grow Money Digital" />
    <meta property="og:description" content="Gestão financeira inteligente para empresas que crescem." />
    <meta property="og:image" content="https://growmoneydigital.com.br/growsoftware/logogrow.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Grow Money Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          var base = document.querySelector('base')?.href || '/';
          // BASE_URL do Vite no build substitui paths; fallback relativo
          var swPath = (typeof window.__GROW_BASE__ === 'string' ? window.__GROW_BASE__ : '') + 'sw.js';
          navigator.serviceWorker.register(swPath).catch(function () {});
        });
      }
    </script>
  </body>
</html>
