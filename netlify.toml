[build]
  command = "npm run build"
  publish = "dist"
  # Node 20 (recomendado para Vite 5+)

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA: todas as rotas voltam para index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
